<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Contact Us</title>

    <link rel="stylesheet" href="../css/contact.css">
</head>
<body>

    <header>

        <nav>

            <div class="logo">
                <img src="../public/Burger_logo.jpg" alt="Jordan Grill Logo">
                <h2>Jordan Grill</h2>
            </div>

            <div class="links">
                <a href="index_pro.html">Home</a>
                <a href="menu.html">Menu</a>
                <a href="about.html">About</a>
                <a href="contact.html">Contact</a>
            </div>

            <button class="order-btn">
                Order Now
            </button>

        </nav>

    </header>
    <section class="hero">

        <img src="../public/back2.jpg" alt="Burger">

        <div class="hero-text">

            <h1>Contact With US</h1>

            

        </div>

    </section>
    <main>
        <form>
            <div class="hero_form">
        <div class="form">
            <label for="name">Name</label><br>
            <input type="text" name="name" id="name" placeholder="Your Name"><br>
            <br>

            <label for="email">Email</label><br>
            <input type="email" name="Email" id="Email" placeholder="Email@gmail.com"><br>
            <br>

            <label for="Subject">Subject</label><br>
            <input type="text" name="Subject" id="Subject" placeholder="Subject"><br>
            <br>

             <label for="message">Message</label><br>
            <textarea id="message" name="message" rows="7" cols="30"></textarea><br>
            <input type="submit" value="Submit"><br>

        </div>
        <div class="mid">

        </div>
        <div>
            <img src="../public/map.jpg.png" alt=""/>
        </div>

        </div>
        </form>
        <section>
            <div class="video">
            <video autoplay muted loop>
            <source src="../public/burger_video.mp4" type="video/mp4">
            </video>
            </div>
        </section>

    </main>
    <footer>

        <div class="footer">

            <h2>Our Story</h2>

            

            <div class="links">
                <a href="index_pro.html">Home</a>
                <a href="menu.html">Menu</a>
                <a href="about.html">About Us</a>
                <a href="contact.html">Contact</a>
            </div>

            <p>© 2026 Our Burger. All Rights Reserved.</p>

        </div>

    </footer>

</body>
</html>
