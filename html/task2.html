<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>solve task2</title>
</head>
<body>
    <!-- create a page contains list, table, and text, apply on text the given tags like mark,
      em... also, contains a form form should contains input/labels at least 7 types of inputs --> 
      <header>
        <h1><strong>solveTask 2</strong></h1>
      </header>
      <main>
        <section>
            <div>
            
            <p> <mark> Items to my home</mark></p>
            <ol>
                <li>tv</li>
                <li>refrigerator</li>
                <li>washing machine</li>
            </ol>
            <ul>
                <li>chair</li>
                <li>table</li>
                <li>bed</li>
            </ul>
            <table border="1">
                <caption>Home Items</caption>
                <tr>
                    <th colspan="2">Item+size</th>
                    <th>Place</th>
                </tr>
                <tr>
                    <td>TV</td>
                    <td>55-inch LED TV</td>
                    <td><em>living</em> room</td>
                </tr>
                <tr>
                    <td>Refrigerator</td>
                    <td><small>Double-door refrigerator</small></td>
                    <td>kitchen</td>
                </tr>
            </table>
            <hr>
            <form>
                <legend>
                <label for="name">Name:</label>
                <input type="text" placeholder="Name..." id="name">
                <br>
                <label for="age">Age:</label>
                <input type="number" placeholder="Age..." id="age">
                <br>
                <label for="email">Email:</label>
                <input type="email" placeholder="Email..." id="email">
                <br>
                <label for="phone">Phone:</label>
                <input type="tel" placeholder="Phone..." id="phone">
                <br>
                <label for="birthdate">Birth Date:</label>
                <input type="date" id="birthdate">
                <br>
                <label for="color">Favorite Color:</label>
                <input type="color" id="color">
                <br>
                <label for="file">Choose file:</label>
                <input type="file" id="file">
                <br>
                <label for="country">Country:</label>
                <select id="country">
                    <option value="us">United States</option>
                    <option value="ca">Canada</option>
                    <option value="uk">United Kingdom</option>
                </select>
                <br>
                <label for="gender">Gender:</label>
                <input type="radio" name="gender" value="male"> Male
                <input type="radio" name="gender" value="female"> Female
                <br>
                <input type="submit" value="Submit">
                <input type="reset" value="Reset">
                </legend>
            </form>
            </div>
        </section>






      </main>
      <footer></footer>
    
</body>
</html>
