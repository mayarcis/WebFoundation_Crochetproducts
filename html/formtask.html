<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form task</title>
</head>
<body>
    <h1>Student Registration Form</h1>
    <p>Fill in your information to create an account.</p>
    <form>
        <legend>
            <div>
            <label for="Full Name">Full Name:  </label>
            <input type="text" placeholder="Enter your full name" id="Full Name" name="Full Name"><br><br>
            <label for="Email">Email Address:</label>
            <input type="email" placeholder="example@email.com" id="Email" name="Email"><br><br>
            <label for="Password">Password:</label>
            <input type="password" placeholder="........" id="Password" name="Password" minlength="8"><br><br>

            <label for="Date of Birth">Date of Birth:</label>
            <input type="date" id="Date of Birth" name="Date of Birth"><br><br>

            <label for="Gender">Gender:</label>
            <input type="radio" id="Male" name="Gender" value="Male">Male
            <input type="radio" id="Female" name="Gender" value="Female">Female
            <input type="radio" id="Other" name="Gender" value="Other">Other
           <br><br>
            <label for="Country">Country:</label>
            <select id="Country" name="Country">
                <option  selected value="Select your country">Select your country</option>
                <option value="USA">USA</option>
                <option value="UK">UK</option>
                <option value="Canada">Canada</option>
                </select>
                <br><br>
            <label for="Favorite Subject">Favorite Subject:</label>
            <input type="checkbox" id="Favorite Subject" name="Favorite Subject" value="HTML">HTML
            <input type="checkbox" id="Favorite Subject" name="Favorite Subject" value="CSS">CSS <br>
            <input type="checkbox" id="Favorite Subject" name="Favorite Subject" value="JavaScript">JavaScript
            <input type="checkbox" id="Favorite Subject" name="Favorite Subject" value="Database">Database
              <br><br>
              <label for="Profile picture">Profile Picture:</label>
              <input type="file" id="Profile picture" name="Profile picture" >
              <br><br>
              <label for="Favorite Color">Favorite Color:</label>
              <input type="color" id="color" name="color">
              <br><br>

              <label for="about">Tell us about yourself:</label>
             <textarea id="about" name="about" placeholder="Write a short bio..." rows="4" cols="50"></textarea>
              <br><br>
              
            
              <label for="Range">Your skill level:</label>
              <input type="range" id="Range" name="Range" min="0" max="100" >
              <span>Beginner</span>
              <br><br>

              <label for="Subscribe">Subscribe to Newsletter:</label>
              <input type="checkbox" id="Subscribe" name="Subscribe" value="Subscribe" >
              <span>Yes, I want to receive updates and news</span>
              <br><br>

              <input type="submit" value="Register">
              <input type="reset" value="Reset">

        </legend>
        </div>
    </form>
    
</body>
</html>
